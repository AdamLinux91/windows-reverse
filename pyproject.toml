[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ntrev"
version = "0.1.0"
description = "Automated NT Kernel Binary Decompilation & Z3 Semantic Equivalence Engine (Phase 1 of Integrated Hybrid Kernel)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AdamLinux91"}
]
dependencies = [
    "capstone>=5.0.0",
    "z3-solver>=4.12.0",
    "pefile>=2023.2.7",
    "llvmlite>=0.42.0",
    "networkx>=3.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
ntrev = "ntrev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
